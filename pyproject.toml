[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lynse-cli"
version = "1.8.2"
description = "Lynse API client and cross-platform command line skill"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.28.0",
]

[project.scripts]
lynse = "lynse:main"

[tool.setuptools]
py-modules = ["lynse"]
